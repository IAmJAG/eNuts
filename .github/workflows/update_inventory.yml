name: Update eNuts Inventory

on:
  push:
    branches:
      - development
    paths-ignore:
      - '.docs/inventory.md'
      - '**/inventory.md'

jobs:
  update-inventory:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Locate and Run Generator Script
        run: |
          # Dynamically find the script anywhere in the workspace, ignoring nesting issues
          SCRIPT_PATH=$(find . -name "__generateInventory.py" | head -n 1)
          
          if [ -z "$SCRIPT_PATH" ]; then
            echo "Error: __generateInventory.py not found!"
            exit 1
          fi
          
          echo "Found script at: $SCRIPT_PATH"
          python "$SCRIPT_PATH"

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Dynamically locate where inventory.md should be or stage it
          git add "**/inventory.md"
          
          if git diff --staged --quiet; then
            echo "No inventory modifications needed."
          else
            git commit -m "docs: update inventory.md using utility script"
            git push
          fi