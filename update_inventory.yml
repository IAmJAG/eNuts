name: Update eNuts Inventory

on:
  push:
    branches:
      - development
    paths-ignore:
      - '.docs/inventory.md'

jobs:
  update-inventory:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate Inventory File
        run: python .scripts/updateInventory.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Ensure .docs directory exists and inventory.md is tracked
          mkdir -p .docs
          git add .docs/inventory.md
          
          if git diff --staged --quiet; then
            echo "No inventory modifications needed."
          else
            git commit -m "docs: update inventory.md using utility script"
            git push
          fi
